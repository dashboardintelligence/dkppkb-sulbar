  /* Mode statis (GitHub Pages): config.js mengisi window.DKPPKB_API dengan URL web app Apps Script.
   * Tanpa itu, dipakai google.script.run (halaman dilayani langsung oleh Apps Script / Blogger). */
  var API_URL = (typeof window.DKPPKB_API === 'string' && /^https:\/\/script\.google\.com\/[^\s"'<>]+$/.test(window.DKPPKB_API)) ? window.DKPPKB_API : '';

  var API_LAMA = { apiImporMonev: 1, apiGantiDaftarIndikator: 1, apiBackup: 1, apiPulihkanBackup: 1 };
  function callFetch(fn, args) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, API_LAMA[fn] ? 330000 : 90000) : null;   // proses besar (impor, ganti daftar) diberi waktu sampai batas Apps Script
    return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('Server mengembalikan status ' + r.status + '.'); return r.text(); })
      .then(function (t) {
        try { return JSON.parse(t); } catch (e) { throw new Error('Respons server tidak valid. Pastikan URL Apps Script benar dan deployment berakses "Siapa saja".'); }
      }, function (e) {
        var abort = e && e.name === 'AbortError', err = new Error(abort ? 'Server terlalu lama menjawab. Coba lagi.' : 'Koneksi ke server gagal. Periksa jaringan Anda.');
        err.retry = !abort; throw err;   // galat jaringan/sibuk dari Apps Script biasanya sementara
      })
      .then(function (v) { if (timer) clearTimeout(timer); return v; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }
  function call(fn, args) {
    if (API_URL) return callFetch(fn, args);
    if (typeof google === 'undefined' || !google.script) return Promise.reject(new Error('URL Apps Script belum diatur. Isi file config.js dengan URL web app.'));
    return new Promise(function (resolve, reject) {
      try {
        var r = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (e) { reject(new Error((e && e.message) || 'Koneksi ke server gagal. Periksa jaringan Anda.')); });
        if (typeof r[fn] !== 'function') throw new Error('Fungsi "' + fn + '" tidak ditemukan di server. Pastikan file Halaman.gs sudah ditempel lengkap dan disimpan, lalu buat deployment versi baru.');
        r[fn].apply(r, args || []);
      } catch (e) { reject(e); }
    });
  }
  /** Seperti call(), tapi mencoba sekali lagi bila gagal karena jaringan / server sibuk (khusus permintaan baca). */
  function callRetry(fn, args) {
    return call(fn, args).catch(function (e) {
      if (!e || !e.retry) throw e;
      return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return call(fn, args); });
    });
  }
  /** Muat halaman dari server. Permintaan yang sama dan masih berjalan dipakai bersama (tidak dikirim dua kali). */
  var INFLIGHT = {};
  function fetchPage(tok, page, p) {
    var key = page + '|' + JSON.stringify(p);
    if (INFLIGHT[key] && INFLIGHT[key].tok === tok) return INFLIGHT[key].pr;
    var pr = callRetry('getPageContent', [tok, page, p]);
    INFLIGHT[key] = { tok: tok, pr: pr };
    var lepas = function () { if (INFLIGHT[key] && INFLIGHT[key].pr === pr) delete INFLIGHT[key]; };
    pr.then(lepas, lepas);
    return pr;
  }
  /** Panggil API ber-token. Mengembalikan data atau melempar Error; sesi habis -> kembali ke login. */
  var PCACHE = {}, READ_API = { apiBootstrap: 1, apiMulai: 1, apiUnduhLampiranPermintaan: 1, apiAmbilIsian: 1, apiDaftarBukti: 1, apiUnduhBukti: 1, apiTarikData: 1, apiUnduhBuktiMonev: 1, apiFotoGaleriAdmin: 1, apiNotifikasi: 1, apiLaporanTw: 1 };
  function api(fn, args) {
    if (!READ_API[fn]) pcBasi();   // ada perubahan data: tandai cache halaman basi
    args = [AppState.sessionToken].concat(args || []);
    return call(fn, args).then(function (r) {
      if (!READ_API[fn]) pcBasi();   // data berubah di server: halaman lama tetap tampil seketika lalu diperbarui
      if (r && r.success) return r.data;
      if (r && r.expired) { forceLogout(r.message); }
      var err = new Error((r && r.message) || 'Terjadi kesalahan.'); err.handled = !!(r && r.expired); throw err;
    });
  }


  /* ---------- percepatan: jelajahi semua halaman dan tab di latar belakang ---------- */
  var PGEN = 0, PQ = [], PRUN = 0, PSEEN = {}, PNSEEN = 0, keepTimer = null, crawlTimer = null, PTTL = 3600000;
  function pcReset() { PCACHE = {}; INFLIGHT = {}; PGEN++; PQ = []; PSEEN = {}; PNSEEN = 0; scheduleCrawl(); }
  /** Setelah data berubah: halaman tersimpan ditandai basi (t = 0), bukan dibuang. Saat dibuka tetap tampil seketika,
   *  lalu versi terbaru diambil dan menggantikannya. Logout/login tetap membuang semuanya (pcReset). */
  function pcBasi() { Object.keys(PCACHE).forEach(function (k) { PCACHE[k].t = 0; }); INFLIGHT = {}; PGEN++; PQ = []; PSEEN = {}; PNSEEN = 0; scheduleCrawl(); }
  function pkey(page, params) { return page + '|' + JSON.stringify(srvParams(page, params)); }
  /** Ambil satu halaman ke cache. Mengembalikan entri cache (atau null bila gagal). */
  function prefetchPage(page, params) {
    if (!AppState.sessionToken) return Promise.resolve(null);
    var p = srvParams(page, params);
    var key = page + '|' + JSON.stringify(p);
    if (PCACHE[key] && Date.now() - PCACHE[key].t < PTTL) return Promise.resolve(PCACHE[key]);
    var gen = PGEN, tok = AppState.sessionToken;
    return fetchPage(tok, page, p).then(function (r) {
      if (r && r.success && !r.redirect && gen === PGEN && tok === AppState.sessionToken) {
        var ks = Object.keys(PCACHE); if (ks.length > 150) delete PCACHE[ks[0]];
        PCACHE[key] = { html: r.html, title: r.title, t: Date.now() };
        return PCACHE[key];
      }
      return null;
    }).catch(function () { return null; });
  }
  /** Antrean: satu permintaan latar sekaligus; yang mendesak (tab dan triwulan lain di halaman aktif) didahulukan. */
  function enqueue(page, params, urgent) {
    if (!AppState.sessionToken || !page || (params && params.tambah)) return;
    var key = pkey(page, params);
    if (PSEEN[key] || PNSEEN > 80) return;
    if (PCACHE[key] && Date.now() - PCACHE[key].t < PTTL) { PSEEN[key] = 1; return; }
    PSEEN[key] = 1; PNSEEN++;
    var job = { page: page, params: params || {} };
    if (urgent) PQ.unshift(job); else PQ.push(job);
    pump();
  }
  function pump() {
    var tok = AppState.sessionToken;
    while (PRUN < 1 && PQ.length && tok && !AppState.navBusy && !document.hidden) {   // satu per satu dan jeda selama pengguna membuka halaman, agar permintaan pengguna tidak mengantre di server
      var job = PQ.shift(); PRUN++;
      (function (j, gen) {
        prefetchPage(j.page, j.params).then(function (e) {
          PRUN--;
          setTimeout(pump, 60);
        });
      })(job, PGEN);
    }
  }
  /** Tab di halaman yang sedang terbuka didahulukan. */
  function prefetchTabs() {
    // triwulan lain di halaman yang sama (yang paling sering dipilih berikutnya)
    var box = $('#app-container .per-pick');
    if (box && $('.per-jn', box).value === 'tw') {
      var ekstra = {}; try { ekstra = JSON.parse(box.getAttribute('data-ekstra') || '{}'); } catch (e) { }
      var kini = Number($('.per-no', box).value);
      [kini - 1, kini + 1, kini - 2, kini + 2, kini - 3, kini + 3].filter(function (n) { return n >= 1 && n <= 4; }).reverse()
        .forEach(function (n) { enqueue(box.getAttribute('data-rute'), Object.assign({}, ekstra, { per: 'tw' + n }), true); });
    }
    $$('#app-container .seg-btn[data-nav]').forEach(function (b) {
      var pr = {}; try { pr = JSON.parse(b.getAttribute('data-params') || '{}'); } catch (e) { }
      enqueue(b.getAttribute('data-nav'), pr, true);
    });
  }
  function prefetchMenu() {
    $$('.nav-item[data-nav]').forEach(function (b) { enqueue(b.getAttribute('data-nav'), {}, false); });
  }
  function scheduleCrawl() {
    clearTimeout(crawlTimer);
    if (!AppState.sessionToken) return;
    crawlTimer = setTimeout(function () { if (AppState.sessionToken) { prefetchTabs(); prefetchMenu(); } }, 8000);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pump(); });   // lanjutkan antrean latar saat tab kembali dibuka
  /** Ping ringan agar server Apps Script tetap hangat selama aplikasi dipakai. */
  function startKeepAlive() {
    if (keepTimer) return;
    keepTimer = setInterval(function () {
      if (!AppState.sessionToken) { clearInterval(keepTimer); keepTimer = null; return; }
      if (document.hidden) return;
      call('apiMerek', []).catch(function () { });
    }, 240000);
  }
  /** Halaman tanpa menu sendiri disorot di menu induknya (Tindak Lanjut dan Permintaan Data di Laporan). */
  function menuInduk(page) {
    if (page === 'monev' && AppState.params && AppState.params.sasaran) return 'monevisi';   // rincian sasaran dibuka dari Isi Data Monev Kinerja
    return { sulbarsehat: 'dashboard', permintaan: 'laporan' }[page] || page;

    page = menuInduk(page);

  function tandaiInduk() {
    $$('.nav-grp').forEach(function (g) {

      if (g === except) return;
      var m = $('.tn-menu', g); if (m && !m.hidden) { m.hidden = true; $('.tn-item', g).setAttribute('aria-expanded', 'false'); }

  var toastTimer;

  /* ---------- modal ---------- */
  var lastFocus = null;

  /* ---------- galeri halaman awal ---------- */
  var GAL = { items: [], i: 0, img: {}, timer: null };
  function galFoto(id) {
    if (GAL.img[id]) return Promise.resolve(GAL.img[id]);
    return call('apiFotoGaleri', [id]).then(function (r) {
      if (!r || !r.success) throw new Error('foto');
      GAL.img[id] = 'data:' + r.data.mime + ';base64,' + r.data.base64; return GAL.img[id];
    });
  }
  function galTampil(n) {
    var it = GAL.items[n]; if (!it) return;
    GAL.i = n;
    var im = $('#gal-img'); im.classList.add('is-load');
    galFoto(it.id).then(function (src) {
      if (GAL.items[GAL.i] !== it) return;
      im.src = src; im.alt = it.judul || 'Foto kegiatan'; im.classList.remove('is-load');
      var nx = GAL.items[(n + 1) % GAL.items.length]; if (nx && nx !== it) galFoto(nx.id).catch(function () { });
    }).catch(function () { im.classList.remove('is-load'); });
    $('#gal-cap').innerHTML = (it.judul ? '<b>' + esc(it.judul) + '</b>' : '') + (it.ket ? '<span>' + esc(it.ket) + '</span>' : '');
    $('#gal-cap').hidden = !(it.judul || it.ket);
    $$('#gal-dots button').forEach(function (b, k) { b.setAttribute('aria-selected', k === n ? 'true' : 'false'); });
  }
  function galGeser(d) { if (GAL.items.length) galTampil((GAL.i + d + GAL.items.length) % GAL.items.length); galJalan(); }
  function galJalan() {
    clearInterval(GAL.timer);
    var diam = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (GAL.items.length > 1 && !diam) GAL.timer = setInterval(function () { if (!document.hidden && !$('#gal-card').matches(':hover') && !$('#gal-card').contains(document.activeElement)) galTampil((GAL.i + 1) % GAL.items.length); }, 6000);
  }
  function galMuat() {
    var card = $('#gal-card'); if (!card || !API_URL) return;
    call('apiGaleriPublik', []).then(function (r) {
      if (!r || !r.success || !Array.isArray(r.data) || !r.data.length) return;
      GAL.items = r.data; card.hidden = false;
      $('#gal-dots').innerHTML = r.data.map(function (x, k) { return '<button type="button" role="tab" aria-label="Foto ' + (k + 1) + '" data-gal="' + k + '"></button>'; }).join('');
      $('#gal-dots').hidden = r.data.length < 2; $('#gal-prev').hidden = $('#gal-next').hidden = r.data.length < 2;
      galTampil(0); galJalan();
    }).catch(function () { });
  }
  /** Perkecil foto di peramban (maks 1280 px, JPEG) sebelum diunggah. */
  function kecilkanFoto(file) {
    return new Promise(function (ok, gagal) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var s = Math.min(1, 1280 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
        cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
        ok(cv.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      im.onerror = function () { URL.revokeObjectURL(url); gagal(new Error('Berkas bukan gambar yang valid.')); };
      im.src = url;
    });
  }
  function submitGaleri(f) {
    var msg = $('.form-msg', f), btn = $('button[type=submit]', f), file = $('#gl-file').files[0];
    msg.className = 'form-msg'; msg.textContent = '';
    if (!file) { msg.textContent = 'Pilih foto terlebih dahulu.'; return; }
    if (file.size > 15 * 1048576) { msg.textContent = 'Foto terlalu besar (maks 15 MB sebelum diperkecil).'; return; }
    var label = btn.innerHTML; btn.disabled = true; btn.textContent = 'Memproses…';
    kecilkanFoto(file).then(function (b64) {
      return api('apiUnggahFoto', [{ base64: b64, judul: f.elements.judul.value, ket: f.elements.ket.value }]);
    }).then(function () { toast('Foto ditambahkan ke galeri.', 'ok'); f.reset(); return reload(); })
      .catch(function (e) { if (e && e.handled) return; msg.textContent = e.message; btn.disabled = false; btn.innerHTML = label; });
  }
  function galThumbs() {
    $$('[data-gal-thumb]').forEach(function (im) {

  /* ---------- logo: unggah gambar dan perkecil di browser ---------- */
  function perkecilLogo(file, selesai, gagal) {
    var fr = new FileReader();
    fr.onerror = function () { gagal('Gambar tidak dapat dibaca.'); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { gagal('File bukan gambar yang valid.'); };
      img.onload = function () {
        var sisi = [256, 192, 128, 96], i = 0;
        (function coba() {
          var skala = Math.min(1, sisi[i] / Math.max(img.width, img.height));
          var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * skala)); c.height = Math.max(1, Math.round(img.height * skala));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var out = c.toDataURL('image/png');
          if (out.length > 44000) out = c.toDataURL('image/webp', 0.82);
          if (out.length > 44000) out = c.toDataURL('image/jpeg', 0.8);
          if (out.length <= 44000 && /^data:image\/(png|jpeg|webp);base64,/.test(out)) return selesai(out);
          if (++i < sisi.length) return coba();
          gagal('Gambar terlalu rumit untuk diperkecil. Pakai logo yang lebih sederhana.');
        })();
      };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(file);
  }

    if (fid === 'form-rv-cetak') return rvCetakKirim(f);
    if (fid === 'form-program-modal') return submitProgramForm(f);
    if (fid === 'form-target') return submitTarget(f);
    if (fid === 'form-bukti') return submitBukti(f);
    if (fid === 'form-monev') return submitMonev(f);
    if (fid === 'form-mvk-baris') return submitMvkBaris(f);
    if (fid === 'form-mbukti') return submitMonevBukti(f);
    if (fid === 'form-galeri') return submitGaleri(f);
    if (fid === 'form-tarik') return;
    if (fid === 'form-md-ajukan') return submitMdAjukan(f);
    if (fid === 'form-jg') return submitJg(f);
    if (f.getAttribute('data-api')) return submitGeneric(f);
  });

  /* ---------- inisialisasi ---------- */
  function init() {
    $('#btn-logout-side').addEventListener('click', logout);
    // Cari menu di bilah samping: sembunyikan item yang tidak cocok (dan judul kelompok yang kosong)
    $('#nav-cari').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase(), label = null, ada = false;
      $$('#nav-side > *').forEach(function (el) {
        if (el.classList.contains('nav-label')) { if (label) label.hidden = !ada; label = el; ada = false; return; }
        var cocok = !q || el.textContent.toLowerCase().indexOf(q) >= 0; el.hidden = !cocok; if (cocok) ada = true;
      });
      if (label) label.hidden = !ada;
    });
    var tl = $('#btn-theme-login');
    if (tl) tl.addEventListener('click', function () { window.DkTheme.next(); toast(window.DkTheme.label()); });
    $('#btn-back').addEventListener('click', goBack);
    document.addEventListener('click', function (ev) { var l = ev.target.closest && ev.target.closest('[data-land]'); if (l) landShow(l.getAttribute('data-land')); });
    if (window.DkTheme) window.DkTheme.refresh();
    applyBrand(document.documentElement.getAttribute('data-nama'), document.documentElement.getAttribute('data-sub'));
    applyFavicon(document.documentElement.getAttribute('data-logo'));
    applyLogo(document.documentElement.getAttribute('data-logo'));
    $('#btn-menu').addEventListener('click', openDrawer);
    $('#btn-notif').addEventListener('click', function (ev) { ev.stopPropagation(); toggleNotif(); });
    $('#btn-user').addEventListener('click', function () {
      var u = AppState.user; if (!u) return;
      openModal('Akun Saya',
        '<div class="pic-line" style="margin-bottom:16px"><div class="avatar">' + esc((u.nama || '?').charAt(0)) + '</div><div><b>' + esc(u.nama) + '</b><div class="muted sm">' + esc(ROLE_LABEL[u.role] || u.role) + (u.bidang ? ' · ' + esc(u.bidang) : '') + '</div></div></div>' +
        '<div class="form-actions" style="margin-bottom:12px"><button class="btn btn-ghost theme-btn" type="button" data-act="theme"><span class="ic" aria-hidden="true">brightness_auto</span><span>Tema: <b class="theme-lbl"></b></span></button></div>' +
        '<div class="form-actions"><button class="btn btn-primary" type="button" data-nav="pengaturan">Pengaturan Akun</button><button class="btn btn-ghost" type="button" data-act="logout">Keluar</button></div>');
      if (window.DkTheme) window.DkTheme.refresh();
    });
    $('#sel-bulan').addEventListener('change', function () { navigateTo(AppState.page, AppState.params).then(function () { prefetchTabs(); prefetchMenu(); }); refreshBadgeForPeriod(); });
    $('#sel-tahun').addEventListener('change', function () { navigateTo(AppState.page, AppState.params).then(function () { prefetchTabs(); prefetchMenu(); }); });
    $('#skip-link').addEventListener('click', function (e) { e.preventDefault(); $('#main').focus(); });
    showLogin('');
    $('#gal-prev').addEventListener('click', function () { galGeser(-1); }); $('#gal-next').addEventListener('click', function () { galGeser(1); });
    $('#gal-dots').addEventListener('click', function (ev) { var b = ev.target.closest && ev.target.closest('[data-gal]'); if (b) { galTampil(Number(b.getAttribute('data-gal'))); galJalan(); } });
    if (API_URL) {
      galMuat();
      try { var cm = JSON.parse(localStorage.getItem('dkppkb_merek') || 'null'); if (cm) { applyBrand(cm.nama, cm.sub); applyLogo(cm.logo); applyFavicon(cm.logo); } } catch (e) { }
      call('apiMerek', []).then(function (r) {
        if (!r || !r.success) return;
        applyBrand(r.data.nama, r.data.sub); applyLogo(r.data.logo); applyFavicon(r.data.logo);
        try { localStorage.setItem('dkppkb_merek', JSON.stringify(r.data)); } catch (e) { }
      }).catch(function () { });
      var tk = null; try { tk = sessionStorage.getItem(SESI_KEY); } catch (e) { }
      if (tk) pulihSesi(tk);
    }
  }
  /** Pulihkan sesi setelah refresh: tampilkan pemuat (bukan halaman login), ulangi bila koneksi lambat, dan hanya keluar bila server menyatakan sesi habis. */
  function pulihSesi(tk, coba) {
    coba = coba || 0;
    AppState.sessionToken = tk;
    if (!coba) { show($('#view-login'), false); busy(true); }
    startApp().then(function () { busy(false); }).catch(function (e) {
      if (e && e.handled) { busy(false); return; }        // sesi benar-benar habis: forceLogout sudah menampilkan login
      if (coba < 3) { setTimeout(function () { pulihSesi(tk, coba + 1); }, 1500 * (coba + 1)); return; }
      busy(false);
      AppState.sessionToken = null;                        // sesi tetap tersimpan: refresh berikutnya mencoba lagi
      showLogin('Koneksi ke server lambat atau terputus. Muat ulang halaman, sesi Anda masih tersimpan.');
    });
  }
  function refreshBadgeForPeriod() { /* lencana mengikuti bulan aktif konfigurasi; tidak berubah saat pratinjau periode */ }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.AppState = AppState; window.navigateTo = navigateTo;
})();
</script>
