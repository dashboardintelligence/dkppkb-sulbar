<script>

 * - Navigasi: navigateTo(page, params) -> getPageContent -> injectPage.
 * - Tanpa window.location / window.open / google.script.host.close.

(function () {
  'use strict';

  (function () { var c = document.getElementById('lp-foot-copy'); if (c) c.textContent = '© ' + new Date().getFullYear() + ' DKPPKB Provinsi Sulawesi Barat'; })();   // tahun di kaki halaman login
  var AppState = { sessionToken: null, user: null, cfg: null, tahunList: [], page: 'dashboard', params: {}, req: 0, pending: null, hist: [] };

  var MENU = [
    { id: 'dashboard', label: 'Dashboard', icon: 'dashboard', group: 'Utama' },

    { id: 'laporan', label: 'Minta Data', icon: 'description', group: 'Utama', roles: ['admin', 'staf', 'admindata', 'adminspbe', 'adminmonev', 'pimpinan'] },   // tidak untuk PIC
    // Menu induk (id diawali _) membuka sub-menu Isi Data dan Review; bila hanya satu sub-menu yang boleh, tampil sebagai satu menu biasa
    { id: '_spbe', label: 'SPBE', icon: 'lan', group: 'Monev', roles: ['admin', 'staf', 'admindata', 'adminspbe', 'adminmonev', 'pic', 'pimpinan'] },
    { id: 'spbeisi', label: 'Isi Data', icon: 'edit_note', group: 'Monev', induk: '_spbe', roles: ['admin', 'staf', 'adminspbe'] },
    { id: 'spbe', label: 'Review', icon: 'fact_check', group: 'Monev', induk: '_spbe', roles: ['admin', 'staf', 'admindata', 'adminspbe', 'adminmonev', 'pic', 'pimpinan'] },
    { id: '_monev', label: 'Monev Kinerja', icon: 'rule', group: 'Monev', roles: ['admin', 'staf', 'admindata', 'adminspbe', 'adminmonev', 'pic', 'pimpinan'] },
    { id: 'monevisi', label: 'Isi Data', icon: 'edit_note', group: 'Monev', induk: '_monev', roles: ['admin', 'staf', 'adminmonev'] },
    { id: 'monev', label: 'Review', icon: 'fact_check', group: 'Monev', induk: '_monev', roles: ['admin', 'staf', 'admindata', 'adminspbe', 'adminmonev', 'pic', 'pimpinan'] },
    { id: 'pengaturan', label: 'Pengaturan', icon: 'settings', group: 'Pengaturan' },
    { id: 'tambahindikator', label: 'Kelola Indikator', icon: 'add_circle', group: 'Pengaturan', roles: ['admin', 'staf', 'admindata', 'adminspbe'] },
    { id: 'pengguna', label: 'Kelola Pengguna', icon: 'group', group: 'Pengaturan', roles: ['admin'] },
    { id: 'panduan', label: 'Panduan Pengguna', icon: 'help', group: 'Pengaturan' }

  // Ikon bilah samping: Phosphor Thin (garis tipis, gaya Apple)
  var IKON_SIDE = { dashboard: 'squares-four', review: 'clipboard-text', inputdata: 'pencil-simple-line', laporan: 'file-text', _spbe: 'cpu', _monev: 'chart-line-up', pengaturan: 'gear-six',
    tambahindikator: 'target', pengguna: 'users', panduan: 'book-open', indikatorsaya: 'sliders-horizontal' };
  var BOTTOM = [
    { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
    { id: 'review', label: 'Review', icon: 'fact_check' },
    { id: 'inputdata', label: 'Isi Data', icon: 'edit_note' },
    { id: 'laporan', label: 'Minta Data', icon: 'description' },

  var TOP = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'review', label: 'Review' },
    { id: 'inputdata', label: 'Isi Data' },
    { id: 'indikatorsaya', label: 'Indikator Saya' },

    { label: 'SPBE', children: ['spbeisi', 'spbe'] },
    { label: 'Monev Kinerja', children: ['monevisi', 'monev'] },
    { label: 'Pengaturan', children: ['pengaturan', 'tambahindikator', 'pengguna', 'panduan'] }
  ];
  var EMBLEM_SVG = '<svg viewBox="0 6 120 108" aria-hidden="true" focusable="false"><path d="M30 82h60a19 19 0 0 0 3-37.8A26 26 0 0 0 43 38a19 19 0 0 0-13 44Z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M34 64h12l5-10 8 20 7-16 6 6h4l8-12M78 52h6v6" fill="none" stroke="#bfe6e1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 82v20M54 96l6 6 6-6M52 34v-6" fill="none" stroke="#d9b45a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="24" r="4" fill="#d9b45a"/></svg>';
  var ROLE_LABEL = { admin: 'Administrator', staf: 'Staf Admin', pimpinan: 'Pimpinan', pic: 'PIC Bidang' };

  /* ---------- util ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function show(el, on) { if (el) el.hidden = !on; }

  /* Mode statis (GitHub Pages): config.js mengisi window.DKPPKB_API dengan URL web app Apps Script.
   * Tanpa itu, dipakai google.script.run (halaman dilayani langsung oleh Apps Script / Blogger). */
  var API_URL = (typeof window.DKPPKB_API === 'string' && /^https:\/\/script\.google\.com\/[^\s"'<>]+$/.test(window.DKPPKB_API)) ? window.DKPPKB_API : '';
  var SESI_KEY = 'dkppkb_sesi';
  function simpanSesi(t) { if (!API_URL) return; try { if (t) sessionStorage.setItem(SESI_KEY, t); else sessionStorage.removeItem(SESI_KEY); } catch (e) { } }
  var API_LAMA = { apiImporMonev: 1, apiGantiDaftarIndikator: 1, apiBackup: 1, apiPulihkanBackup: 1, apiBersihkanData: 1 };
  function callFetch(fn, args, luar) {
    var ctl = luar || (typeof AbortController === 'function' ? new AbortController() : null);
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, API_LAMA[fn] ? 330000 : 90000) : null;   // proses besar (impor, ganti daftar) diberi waktu sampai batas Apps Script
    return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('Server mengembalikan status ' + r.status + '.'); return r.text(); })
      .then(function (t) {
        try { return JSON.parse(t); } catch (e) { var eJ = new Error('Server sedang bermasalah. Coba lagi sebentar.'); eJ.retry = true; throw eJ; }   // Google mengirim halaman galat, bukan JSON
      }, function (e) {
        var abort = e && e.name === 'AbortError', err = new Error(abort ? 'Server terlalu lama menjawab. Coba lagi.' : 'Koneksi ke server gagal. Periksa jaringan Anda.');
        err.retry = !abort; throw err;   // galat jaringan/sibuk dari Apps Script biasanya sementara
      })
      .then(function (v) { if (timer) clearTimeout(timer); return v; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }
  function call(fn, args) {
    if (API_URL) return callFetch(fn, args);
    if (typeof google === 'undefined' || !google.script) return Promise.reject(new Error('URL Apps Script belum diatur. Isi file config.js dengan URL web app.'));
    return new Promise(function (resolve, reject) {
      try {
        var r = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (e) { var eG = new Error((e && e.message) || 'Koneksi ke server gagal. Periksa jaringan Anda.'); eG.retry = true; reject(eG); });
        if (typeof r[fn] !== 'function') throw new Error('Fungsi "' + fn + '" tidak ditemukan di server. Pastikan file Halaman.gs sudah ditempel lengkap dan disimpan, lalu buat deployment versi baru.');
        r[fn].apply(r, args || []);
      } catch (e) { reject(e); }
    });
  }
  /** Baca dengan cadangan: sesekali panggilan Apps Script macet puluhan detik walau hanya membaca (terukur 4 Nov 2026, juga di fungsi paling ringan).
   *  Bila belum dijawab dalam 6 dtk, kirim sekali lagi dan pakai yang lebih dulu selesai; yang kalah dibatalkan. */
  function callCadang(fn, args, tunggu) {
    if (!API_URL || typeof AbortController !== 'function') return call(fn, args);
    return new Promise(function (ok, gagal) {
      var selesai = false, jalan = 1, ctl = [new AbortController()], timer = null;
      function menang(v) { if (selesai) return; selesai = true; clearTimeout(timer); ctl.forEach(function (c) { try { c.abort(); } catch (e) { } }); ok(v); }
      function kalah(e) { jalan--; if (selesai || jalan > 0) return; selesai = true; clearTimeout(timer); gagal(e); }
      callFetch(fn, args, ctl[0]).then(menang, kalah);
      timer = setTimeout(function () { if (selesai) return; var c = new AbortController(); ctl.push(c); jalan++; callFetch(fn, args, c).then(menang, kalah); }, tunggu || 6000);
    });
  }
  /** Permintaan baca: pakai cadangan, dan ulangi sekali bila gagal karena jaringan / server sibuk. */
  function callBaca(fn, args, tunggu) {
    return callCadang(fn, args, tunggu).catch(function (e) {
      if (!e || !e.retry) throw e;
      return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return callCadang(fn, args, tunggu); });
    });
  }
  /** Muat halaman dari server. Permintaan yang sama dan masih berjalan dipakai bersama (tidak dikirim dua kali). */
  var INFLIGHT = {};
  function fetchPage(tok, page, p) {
    var key = page + '|' + JSON.stringify(p);
    if (INFLIGHT[key] && INFLIGHT[key].tok === tok) return INFLIGHT[key].pr;
    var pr = callBaca('getPageContent', [tok, page, p]);
    INFLIGHT[key] = { tok: tok, pr: pr };
    var lepas = function () { if (INFLIGHT[key] && INFLIGHT[key].pr === pr) delete INFLIGHT[key]; };
    pr.then(lepas, lepas);
    return pr;
  }
  /** Panggil API ber-token. Mengembalikan data atau melempar Error; sesi habis -> kembali ke login.
   *  Penulisan dikirim lewat tulisDanHalaman: halaman yang sedang dibuka ikut kembali dalam satu panggilan, sehingga reload() sesudah Simpan tidak perlu ke server. */
  var PCACHE = {}, READ_API = { apiDataUsang: 1, apiCatatTarik: 1, apiPratinjauImporAkun: 1, apiBootstrap: 1, apiMulai: 1, apiSapaan: 1, apiUnduhLampiranPermintaan: 1, apiAmbilIsian: 1, apiDaftarBukti: 1, apiUnduhBukti: 1, apiTarikData: 1, apiUnduhBuktiMonev: 1, apiLaporanTw: 1 };
  var TANPA_HALAMAN = { apiUnggahBuktiSpbe: 1, apiHapusBuktiSpbe: 1, apiSimpanProfil: 1, apiUbahPassword: 1, apiSimpanBackupAtur: 1 };
  function api(fn, args) {
    var baca = !!READ_API[fn], bungkus = !baca && !API_LAMA[fn], hal = null;
    args = [AppState.sessionToken].concat(args || []);
    if (bungkus && !TANPA_HALAMAN[fn] && AppState.rendered) hal = { page: AppState.page, params: srvParams(AppState.page, AppState.params) };
    return (bungkus ? call('tulisDanHalaman', [fn, args, hal]) : fn === 'apiMulai' ? callBaca(fn, args) : call(fn, args)).then(function (r) {
      if (!baca && r && r.success) { if (bungkus) pcSesudahTulis(r, hal); else cekVersi(); }
      if (r && r.success) return r.data;
      if (r && r.expired) { forceLogout(r.message); }
      var err = new Error((r && r.message) || 'Terjadi kesalahan.'); err.handled = !!(r && r.expired); throw err;
    });
  }

  /* ---------- salinan di browser (IndexedDB): membuka aplikasi lagi tampil seketika, lalu diperbarui bila datanya berubah ---------- */
  var DB_VER = window.DKPPKB_VER || 'dev', DB_TAHAN = 7 * 86400000, dbJanji = null;
  var TANPA_SALINAN = { pengguna: 1, laporan: 1, permintaan: 1, pengaturan: 1 };   // memuat data pribadi: hanya di memori
  function dbBuka() {
    if (dbJanji) return dbJanji;
    dbJanji = new Promise(function (ok) {
      if (!API_URL || !window.indexedDB) return ok(null);
      var r;
      try { r = indexedDB.open('dkppkb_salinan', 1); } catch (e) { return ok(null); }
      r.onupgradeneeded = function () { r.result.createObjectStore('hal', { keyPath: 'k' }); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = r.onblocked = function () { ok(null); };
    });
    return dbJanji;
  }
  function dbTulis(rec) { dbBuka().then(function (db) { if (db) try { db.transaction('hal', 'readwrite').objectStore('hal').put(rec); } catch (e) { } }); }
  function dbBersih() { dbBuka().then(function (db) { if (db) try { db.transaction('hal', 'readwrite').objectStore('hal').clear(); } catch (e) { } }); }
  /** Masukkan salinan milik pengguna ini ke cache memori; milik orang lain atau dari versi aplikasi lain dibuang. */
  function salinanMuat(u) {
    return dbBuka().then(function (db) {
      return new Promise(function (ok) {
        if (!db) return ok(null);
        var t;
        try { t = db.transaction('hal', 'readwrite'); } catch (e) { return ok(null); }
        var st = t.objectStore('hal'), q = st.getAll(), hasil = { boot: null, tv: null };
        q.onerror = function () { ok(null); };
        q.onsuccess = function () {
          var sah = [];
          (q.result || []).forEach(function (r) {
            if (r.u !== u || r.v !== DB_VER || Date.now() - r.t > DB_TAHAN) { st.delete(r.k); return; }
            if (r.k === 'boot') hasil.boot = r; else if (r.k === 'tv') hasil.tv = r; else sah.push(r);
          });
          sah.sort(function (a, b) { return b.t - a.t; });
          sah.forEach(function (r, i) {
            if (i >= 60) { st.delete(r.k); return; }
            var k = r.k.slice(4);
            if (!PCACHE[k]) PCACHE[k] = { html: r.html, title: r.title, t: r.t, dep: r.dep };
          });
          ok(hasil);
        };
      });
    });
  }
  function bootSimpan(d, awal) {
    if (d.user) dbTulis({ k: 'boot', u: d.user.username, v: DB_VER, boot: d, awal: awal, tv: TV, t: Date.now() });
    try { sessionStorage.setItem(SESI_KEY + '_u', d.user.username); } catch (e) { }
  }
  /** Simpan satu halaman ke cache memori dan salinan browser. */
  function pcSimpan(key, r, page) {
    var ks = Object.keys(PCACHE); if (ks.length > 150) delete PCACHE[ks[0]];
    PCACHE[key] = { html: r.html, title: r.title, t: Date.now(), dep: r.dep };
    if (r.dep) { Object.keys(r.dep).forEach(function (n) { TV[n] = r.dep[n]; }); }
    if (!TANPA_SALINAN[page] && AppState.user) dbTulis({ k: 'hal|' + key, u: AppState.user.username, v: DB_VER, html: r.html, title: r.title, t: PCACHE[key].t, dep: r.dep });
    return PCACHE[key];
  }

  /* ---------- versi data: halaman yang tabelnya tidak berubah tidak perlu diambil lagi dari server ---------- */
  var PQ = [], PRUN = 0, PSEEN = {}, PNSEEN = 0, keepTimer = null, crawlTimer = null, pumpTimer = null, PTTL = 7200000, BATCH = 8;
  var TV = {}, TV_WAKTU = 0, cekJalan = null, crawlAkhir = 0, BOOT_DEP = null;
  /** Halaman masih segar: versi semua tabel yang dibacanya sama dengan versi terbaru, dibuat hari ini, dan belum terlalu lama. */
  function entSegar(e) {
    if (!e || !e.dep || !e.t || Date.now() - e.t > PTTL || new Date(e.t).toDateString() !== new Date().toDateString()) return false;
    return Object.keys(e.dep).every(function (n) { return TV[n] === e.dep[n]; });
  }
  function pcReset() { PCACHE = {}; INFLIGHT = {}; TV = {}; TV_WAKTU = 0; crawlAkhir = 0; PQ = []; PSEEN = {}; PNSEEN = 0; scheduleCrawl(); }
  function pkey(page, params) { return page + '|' + JSON.stringify(srvParams(page, params)); }
  /** Versi terbaru diterima: halaman yang sedang dibuka disegarkan diam-diam bila tabelnya berubah, halaman lain diperbarui berkelompok. */
  function tvTerapkan(tv) {
    if (!tv) return;
    var berubah = Object.keys(tv).some(function (n) { return TV[n] !== tv[n]; });
    TV = tv; TV_WAKTU = Date.now();
    if (AppState.user) dbTulis({ k: 'tv', u: AppState.user.username, v: DB_VER, tv: tv, t: TV_WAKTU });
    if (!berubah) return;
    PSEEN = {}; PNSEEN = 0;
    segarkanBila();
    scheduleCrawl();
    if (BOOT_DEP && Object.keys(BOOT_DEP).some(function (n) { return tv[n] !== BOOT_DEP[n]; })) bootSegarkan();
  }
  /** Identitas, menu, atau periode berubah di server: bangun ulang bingkai tanpa mengganggu halaman. */
  function bootSegarkan() {
    BOOT_DEP = null;
    api('apiBootstrap').then(function (d) {
      AppState.user = d.user; AppState.cfg = d.cfg; AppState.tahunList = d.tahunList; BOOT_DEP = d.dep || null;
      var bl = $('#sel-bulan').value, th = $('#sel-tahun').value;
      buildChrome(d);
      if (bl) $('#sel-bulan').value = bl;
      if (th && $('#sel-tahun option[value="' + th + '"]')) $('#sel-tahun').value = th;
      markMenu(AppState.page);
      bootSimpan(d, AppState.awal);
    }).catch(function () { });
  }
  /** Cek ringan ke server: sesi masih berlaku dan versi tabel terbaru. */
  function cekVersi() {
    if (!AppState.sessionToken) return Promise.resolve();
    if (cekJalan) return cekJalan;
    var tok = AppState.sessionToken;
    cekJalan = callBaca('apiVersi', [tok]).then(function (r) {
      cekJalan = null;
      if (tok !== AppState.sessionToken || !r) return;
      if (r.expired) return forceLogout(r.message);
      if (r.success) tvTerapkan(r.data.tv);
    }, function () { cekJalan = null; });
    return cekJalan;
  }
  function cekVersiBila() { if (Date.now() - TV_WAKTU > 30000) cekVersi(); }
  /** Halaman yang sedang dibuka sudah basi: ambil versi baru tanpa mengganggu. Bila pengguna sudah menyentuh halaman, tampilan tidak diganti; salinan baru dipakai saat dibuka lagi. */
  function segarkanBila() {
    if (!AppState.rendered || AppState.navBusy || !AppState.sessionToken) return;
    var page = AppState.page, params = AppState.params, key = pkey(page, params), ent = PCACHE[key], my = AppState.req;
    if (ent && entSegar(ent)) return;
    fetchPage(AppState.sessionToken, page, srvParams(page, params)).then(function (r) {
      if (!r || !r.success || r.redirect) return;
      pcSimpan(key, r, page);
      if (my === AppState.req && !ent) return;
      if (my === AppState.req && r.html !== ent.html && !halamanDisentuh()) injectPage(page, r.html, r.title, { keep: true });
    }).catch(function () { });
  }
  function halamanDisentuh() {
    var c = $('#app-container'), ae = document.activeElement;
    return !!AppState.disentuh || !!$('#modal-back') || ssgKotor() || !!(ae && c && c.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
  }
  /** Sesudah menulis: pakai versi dan halaman yang ikut dikirim server. */
  function pcSesudahTulis(r, hal) {
    if (r.halaman && r.halaman.success && !r.halaman.redirect && hal) {
      var key = hal.page + '|' + JSON.stringify(hal.params), e = pcSimpan(key, r.halaman, hal.page);
      e.baru = Date.now();
    }
    if (r.tv) tvTerapkan(r.tv); else cekVersi();
  }

  /* ---------- percepatan: jelajahi halaman di latar belakang, berkelompok dalam satu panggilan ---------- */
  function enqueue(page, params, urgent) {
    if (!AppState.sessionToken || !page || (params && params.tambah)) return;
    var key = pkey(page, params);
    if (PSEEN[key] || PNSEEN > 80) return;
    if (entSegar(PCACHE[key])) { PSEEN[key] = 1; return; }
    PSEEN[key] = 1; PNSEEN++;
    var job = { page: page, params: params || {} };
    if (urgent) PQ.unshift(job); else PQ.push(job);
    clearTimeout(pumpTimer); pumpTimer = setTimeout(pump, 200);   // tunggu sebentar agar beberapa halaman ikut satu panggilan
  }
  function pump() {
    var tok = AppState.sessionToken;
    if (PRUN || !PQ.length || !tok || AppState.navBusy || document.hidden) return;   // satu panggilan latar sekaligus, dan jeda selama pengguna membuka halaman
    var kerja = PQ.splice(0, BATCH), daftar = kerja.map(function (j) { var p = srvParams(j.page, j.params); return { k: j.page + '|' + JSON.stringify(p), page: j.page, params: p }; });
    PRUN = 1;
    callCadang('apiMuatHalaman', [tok, daftar], 25000).then(function (r) {
      PRUN = 0;
      if (tok !== AppState.sessionToken || !r) return;
      if (r.expired) return forceLogout(r.message);
      if (!r.success) return;
      r.data.hasil.forEach(function (x, i) { var h = x.r; if (h && h.success && !h.redirect && h.html) pcSimpan(x.k, h, kerja[i].page); });
      tvTerapkan(r.data.tv);
      PQ = kerja.slice(r.data.hasil.length).concat(PQ);   // sisa yang belum sempat dihitung server
      setTimeout(pump, 100);
    }, function () { PRUN = 0; });
  }
  /** Tab di halaman yang sedang terbuka didahulukan. */
  function prefetchTabs() {
    // triwulan lain di halaman yang sama (yang paling sering dipilih berikutnya)
    var box = $('#app-container .per-pick');
    if (box && $('.per-jn', box).value === 'tw') {
      var ekstra = {}; try { ekstra = JSON.parse(box.getAttribute('data-ekstra') || '{}'); } catch (e) { }
      var kini = Number($('.per-no', box).value);
      [kini - 1, kini + 1, kini - 2, kini + 2, kini - 3, kini + 3].filter(function (n) { return n >= 1 && n <= 4; }).reverse()
        .forEach(function (n) { enqueue(box.getAttribute('data-rute'), Object.assign({}, ekstra, { per: 'tw' + n }), true); });

  /* ---------- router SPA ---------- */
  function periode() { return { tahun: Number($('#sel-tahun').value), bulan: Number($('#sel-bulan').value) }; }

  /* ---------- pilihan periode (Dashboard, Review, Isi Data) ----------
   * per = b1–b12 | tw1–tw4 | s1–s2; angka kumulatif, jadi periode dibaca di bulan akhirnya. Pilihan diingat antarhalaman,
   * dan pemilih Bulan di bilah atas disembunyikan di halaman ini karena sudah digantikan. */
  var PER_HAL = ['dashboard', 'review', 'inputdata'];
  function perSimpan(v) { try { if (v) localStorage.setItem('dkppkb_per', v); } catch (e) { } }
  function perIngat() { try { return localStorage.getItem('dkppkb_per') || ''; } catch (e) { return ''; } }
  function perAkhir(per) {
    var x = /^(b|tw|s)(\d{1,2})$/.exec(String(per || '')); if (!x) return 0;
    var n = Number(x[2]); return x[1] === 'b' ? n : x[1] === 'tw' ? n * 3 : n * 6;
  }
  function perHal(page, params) { return PER_HAL.indexOf(page) >= 0 && (params || {}).mode !== 'lengkap'; }
  /** Parameter yang dikirim ke server untuk satu halaman. Dipakai navigasi, prefetch, dan kunci cache agar selalu sama. */
  function srvParams(page, params) {
    var p = Object.assign({}, params || {}, periode());
    if (!perHal(page, params)) return p;
    var per = p.per || (p.tw ? '' : perIngat()), akhir = perAkhir(per);
    if (akhir) { p.per = per; p.bulan = akhir; }
    return p;
  }
  function perGanti(t) {
    var box = t.closest('.per-pick'), jn = $('.per-jn', box).value, no = Number($('.per-no', box).value);
    if (t.classList.contains('per-jn')) {   // ganti jenis: pilih periode jenis baru yang memuat bulan akhir sebelumnya
      var akhir = Number(box.getAttribute('data-akhir')) || 3;
      no = jn === 'bulan' ? akhir : jn === 'tw' ? Math.ceil(akhir / 3) : Math.ceil(akhir / 6);
    }
    var kode = { bulan: 'b', tw: 'tw', sm: 's' }[jn] + no, ekstra = {};
    try { ekstra = JSON.parse(box.getAttribute('data-ekstra') || '{}'); } catch (e) { }
    perSimpan(kode);
    navigateTo(box.getAttribute('data-rute'), Object.assign(ekstra, { per: kode }));
  }
  function navigateTo(page, params, opts) {
    if (!AppState.sessionToken) return Promise.resolve();
    if (ssgKotor() && !confirm('Ada angka yang belum disimpan. Tinggalkan halaman ini?')) return Promise.resolve();
    params = params || {};
    var my = ++AppState.req;
    if (!(opts && (opts.keep || opts.back || opts.redirect)) && AppState.rendered && (page !== AppState.page || JSON.stringify(params) !== JSON.stringify(AppState.params))) {
      AppState.hist.push({ page: AppState.page, params: AppState.params });
      if (AppState.hist.length > 30) AppState.hist.shift();
    }
    AppState.page = page; AppState.params = params;
    updBack(); markMenu(page);   // sorot menu seketika saat diklik
    closeDrawer(); busy(true);
    var c = $('#app-container');
    var wrapBln = $('#sel-bulan') && $('#sel-bulan').closest('.period');
    if (wrapBln) wrapBln.classList.toggle('no-bulan', perHal(page, params));
    var p = srvParams(page, params);
    var ckey = page + '|' + JSON.stringify(p), ent = PCACHE[ckey], baru = ent && ent.baru && Date.now() - ent.baru < 20000;   // baru = ikut kembali bersama Simpan
    var hit = ent && (baru || !(opts && (opts.keep || opts.redirect))) ? ent : null;
    if (hit) {
      injectPage(page, hit.html, hit.title, opts);   // tampil seketika
      if (baru) hit.baru = 0;
      if (baru || (opts && opts.fresh) || entSegar(hit)) { busy(false); cekVersiBila(); setTimeout(pump, 300); return Promise.resolve(); }   // datanya belum berubah: tidak perlu ke server sama sekali
    } else if (!(opts && opts.keep)) c.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    AppState.navBusy = true;
    function selesai() { if (my === AppState.req) { AppState.navBusy = false; setTimeout(pump, 300); } }
    return fetchPage(AppState.sessionToken, page, p).then(function (r) {
      selesai();
      if (my !== AppState.req) return;
      busy(false);
      if (!r) throw new Error('Respons kosong dari server.');
      if (r.expired) return forceLogout(r.message);
      if (!r.success) { c.innerHTML = '<div class="card card-pad empty"><span class="ic">cloud_off</span><p>' + esc(r.message || 'Gagal memuat halaman.') + '</p><button type="button" class="btn btn-primary" data-act="reload">Coba lagi</button></div>'; return; }
      if (r.redirect) { if (r.message) toast(r.message + ' (halaman: ' + page + ')', 'err'); return navigateTo(r.redirect, {}, { redirect: true }); }
      pcSimpan(ckey, r, page);
      if (hit) {
        if (r.html !== hit.html && !halamanDisentuh()) injectPage(page, r.html, r.title, { keep: true });
        return;
      }
      injectPage(page, r.html, r.title, opts);
    }).catch(function (e) {
      selesai();
      if (my !== AppState.req) return;
      busy(false);
      if (hit) return;
      c.innerHTML = '<div class="card card-pad empty"><span class="ic">cloud_off</span><p>' + esc(e.message) + '</p><button type="button" class="btn btn-primary" data-act="reload">Coba lagi</button></div>';
    });
  }

  /* ---------- logo: unggah gambar dan perkecil di browser ---------- */
  function perkecilLogo(file, selesai, gagal) {
    var fr = new FileReader();
    fr.onerror = function () { gagal('Gambar tidak dapat dibaca.'); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { gagal('File bukan gambar yang valid.'); };
      img.onload = function () {
        var sisi = [256, 192, 128, 96], i = 0;
        (function coba() {
          var skala = Math.min(1, sisi[i] / Math.max(img.width, img.height));
          var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * skala)); c.height = Math.max(1, Math.round(img.height * skala));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var out = c.toDataURL('image/png');
          if (out.length > 44000) out = c.toDataURL('image/webp', 0.82);
          if (out.length > 44000) out = c.toDataURL('image/jpeg', 0.8);
          if (out.length <= 44000 && /^data:image\/(png|jpeg|webp);base64,/.test(out)) return selesai(out);
          if (++i < sisi.length) return coba();
          gagal('Gambar terlalu rumit untuk diperkecil. Pakai logo yang lebih sederhana.');
        })();
      };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(file);
  }

      var tx = lbl[i]; if (tx) { var ts = $('tspan', tx); if (ts) ts.textContent = I.prov ? '' : fv(v); tx.style.fill = kl < 0 ? 'var(--tx)' : kl >= 3 ? '#fff' : '#1d1d1f'; tx.style.stroke = kl < 0 ? 'var(--card)' : kl >= 3 ? 'rgba(0,0,0,.25)' : 'rgba(255,255,255,.7)'; }
    });
    petaIndLebar(sel);
    $('.db-hint', blok).innerHTML = I.prov ? esc('Indikator tingkat provinsi: diisi satu angka untuk provinsi (' + fv(I.pv) + '), jadi tidak ada sebaran per kabupaten.')
      : esc(I.g + (I.b ? ' · ' + I.b : '') + ' · ' + I.akum + (bertarget ? ' · target ' + (I.neg ? '≤ ' : '≥ ') + fv(I.tgt) : I.akum === 'persentase' ? ' · target belum diisi' : '') + ' · ' + (bertarget ? 'warna = capaian terhadap target' : 'warna = dibanding kabupaten tertinggi') + (I.neg ? ' (dibalik)' : '')) +
        (I.neg ? ' <b class="ssg-neg">Indikator Negatif</b>' : '');
    var urut = kabs.filter(function (k) { return true; }).sort(function (a, b) { var x = nilai(a), y = nilai(b); if (x === null) return 1; if (y === null) return -1; return I.neg ? x - y : y - x; });
    var lebar = function (v) { return v === null ? 0 : I.akum === 'persentase' ? Math.min(100, v) : (mx > 0 ? v / mx * 100 : 0); };
    $('.db-bars', blok).innerHTML = I.prov ? '<p class="muted sm">Pilih indikator lain untuk melihat sebaran per kabupaten.</p>' : urut.map(function (k) {
      var v = nilai(k), kl = kelas(skor(v));
      return '<div class="db-bar" data-k="' + esc(k) + '"><span>' + esc(k) + '</span><div class="db-t"><i style="width:' + lebar(v).toFixed(1) + '%;background:' + (kl < 0 ? 'var(--rail)' : PETA_SK[kl]) + '"></i>' +
        (bertarget ? '<b style="left:' + Math.min(100, I.tgt) + '%"></b>' : '') + '</div><span>' + fv(v) + '</span></div>';
    }).join('');
    var lg = $('.db-pleg .db-legend', blok); if (lg) { lg.hidden = !bertarget; lg.innerHTML = '<i></i>target ' + (I.neg ? '≤ ' : '') + fv(I.tgt); }
  }
  /* Peta Dashboard: sorot kabupaten saat kursor di peta atau di barisnya, dan tampilkan keterangan di dekat kursor */
  function petaSorot(blok, k) {
    $$('.db-pk', blok).forEach(function (p) { p.classList.toggle('on', p.getAttribute('data-k') === k); });

  }
  document.addEventListener('mousemove', function (ev) {
    var t = ev.target, blok = t.closest && t.closest('.db-pblok'); if (!blok) return;

    if (!p) { tip.hidden = true; return; }

    tip.innerHTML = '<b>' + esc(d[0] || '') + '</b>' + d.slice(1).map(function (x) { x = x.split('|'); return '<span>' + esc(x[0]) + '<em>' + esc(x[1] || '') + '</em></span>'; }).join('');
    var r = $('.db-pw', blok).getBoundingClientRect();
    tip.hidden = false; tip.style.left = Math.min(r.width - 170, ev.clientX - r.left + 12) + 'px'; tip.style.top = (ev.clientY - r.top + 12) + 'px';
  });
  document.addEventListener('mouseout', function (ev) {
    var blok = ev.target.closest && ev.target.closest('.db-pblok'); if (!blok || (ev.relatedTarget && blok.contains(ev.relatedTarget))) return;
    petaSorot(blok, null); $('.db-tip', blok).hidden = true;
  });
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.classList && ev.target.classList.contains('dsb-cari')) { dsbSaring(); return; }
    if (ev.target && ev.target.id === 'ssg-q') { ssgSaring(); return; }

    if (ev.target && ev.target.classList && ev.target.classList.contains('is-cari')) { isGambar(); var c = $('.is-cari'); if (c) { c.focus(); } return; }
    if (ev.target && ev.target.hasAttribute && ev.target.hasAttribute('data-ia-u')) { var iu = IA.rows[+ev.target.getAttribute('data-ia-u')]; iu.username = ev.target.value.trim().toLowerCase(); if (iu.status === 'e' && /Username/.test(iu.pesan)) iu.pilih = true; var cb = $('[data-ia-pilih="' + ev.target.getAttribute('data-ia-u') + '"]'); if (cb) { cb.disabled = false; cb.checked = iu.pilih; } iaSinkron(); return; }
    if (ev.target && ev.target.classList && ev.target.classList.contains('td-cari')) { tdUbah(ev.target); return; }
    if (ev.target && ev.target.classList && ev.target.classList.contains('md-cari')) { MD.q = ev.target.value; var pos = ev.target.selectionStart; mdTabel(); var c = $('#md .md-cari'); if (c) { c.focus(); try { c.setSelectionRange(pos, pos); } catch (e) { } } return; }
    if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-md') === 'c') { mdUbah(ev.target); return; }
    if (ev.target && ev.target.classList && ev.target.classList.contains('ssg-in')) { ssgCekBaris(ev.target); ssgStatus(); }
    if (ev.target && ev.target.classList && ev.target.classList.contains('lbr-in')) { lbrCek(ev.target); lbrStatus(); if (ev.target.tagName === 'TEXTAREA' && ev.target.closest('.mvk-t')) mvkPas(ev.target); }
    var t = ev.target;
    if (t.form && t.form.classList && t.form.classList.contains('ia-form') && t.tagName === 'INPUT') { iaSync(t.form); return; }
    if (t.matches && t.matches('.tgt-in')) {
      var f = t.form, n = $$('.tgt-in', f).filter(function (el) { return el.value.trim() !== el.getAttribute('data-orig'); }).length;
      var info = $('#tgt-info'); if (info) info.textContent = n ? n + ' kotak diubah, belum disimpan' : '';
      t.classList.toggle('dirty', t.value.trim() !== t.getAttribute('data-orig'));
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.classList && t.classList.contains('dsb-sel')) { dsbSaring(); return; }
    if (t.classList && t.classList.contains('ssg-fil')) { ssgSaring(); return; }
    if (t.classList && t.classList.contains('tkk-sel')) { tkkSinkron(); return; }
    if (t.id === 'ia-file' && t.files && t.files[0]) { iaBaca(t.files[0]); return; }
    if (t.hasAttribute && t.hasAttribute('data-ia-pilih')) { IA.rows[+t.getAttribute('data-ia-pilih')].pilih = t.checked; iaSinkron(); return; }
    if (t.hasAttribute && t.hasAttribute('data-ia-ik')) { var io = IA.rows[+t.getAttribute('data-ia-ik')]; io.ik = $$('[data-ia-ik="' + t.getAttribute('data-ia-ik') + '"]').filter(function (c) { return c.checked; }).map(function (c) { return c.value; }); var sm = t.closest('details').querySelector('summary'); if (sm) sm.textContent = io.ik.length + ' dari ' + io.indikator.length + ' indikator dipilih'; return; }
    if (t.classList && t.classList.contains('db-pind')) { petaInd(t.closest('.db-pblok'), false); return; }
    if (t.classList && t.classList.contains('lbr-in')) { lbrCek(t); lbrStatus(); return; }
    if (t.classList && t.classList.contains('rv-kab')) { var rm = rvMeta(); navigateTo('review', Object.assign({ per: rm.per }, t.value ? { kab: t.value } : {})); return; }
    if (t.id === 'ssg-file' && t.files && t.files[0]) { ssgUnggah(t.files[0]); t.value = ''; return; }
    if (t.id === 'mvk-file' && t.files && t.files[0]) { mvkUnggah(t.files[0]); t.value = ''; return; }
    if (t.classList && t.classList.contains('spbk-file')) { spbkUnggah(t); return; }
    if (t.id === 'mvk-tw' || t.id === 'mvk-unit') { if (MVK) { MVK.det = null; mvkGambar(); } return; }
    if (t.id === 'mvk-jenis' && t.form) { var fm = t.form; fm.elements.induk.innerHTML = mvkIndukOpsi(mvkMeta(), t.value, fm.elements.induk.value, fm.getAttribute('data-id')); return; }
    if (t.classList && (t.classList.contains('per-jn') || t.classList.contains('per-no'))) { perGanti(t); return; }
    if (t.form && t.form.getAttribute('id') === 'form-isian' && t.name === 'keterangan') { sinkIsian(t.form); return; }
    if (t.form && t.form.id === 'form-user-modal' && (t.name === 'role' || t.name === 'modeSandi' || t.name === 'bidang')) { syncUserForm(t.form); return; }
    if (t.form && t.form.getAttribute('id') === 'form-user-modal' && (t.name === 'ik' || t.name === 'program')) { syncIk(t.form); return; }
    if (t.form && t.form.classList.contains('ia-form')) { if (t.name === 'akumulasi') t.form._iaManual = true; if (t.form.id === 'form-ind-baru' && t.name === 'bidang') syncIndBaru(t.form); iaSync(t.form); return; }
    if (t.form && t.form.getAttribute('id') === 'form-ind-baru' && t.name === 'bidang') { syncIndBaru(t.form); return; }
    if (t.form && t.form.getAttribute('id') === 'form-indikator' && t.name === 'bidang') { filterBidangOpts(t.form.elements.program, t.value); return; }
    if (t.form && t.form.getAttribute('id') === 'form-tarik') { syncTarik(t.form); return; }
    if (tdUbah(t)) return;
    if (mdUbah(t)) return;
    if (t.id === 'profil-file' && t.files && t.files[0]) { profilFile(t.files[0]); t.value = ''; return; }
    if (t.id === 'logo-file' && t.files && t.files[0]) {
      var info = $('#logo-info'), fcfg = $('#form-config');
      if (info) info.textContent = 'Memproses gambar…';
      perkecilLogo(t.files[0], function (url) {
        fcfg.elements.logoData.value = url; fcfg.elements.logoUrl.value = ''; setLogoPreview(url);
        if (info) info.textContent = 'Logo baru siap (' + Math.round(url.length / 1024) + ' KB). Tekan Simpan Konfigurasi untuk menerapkan.';
      }, function (pesan) { if (info) info.textContent = pesan; });
      return;
    }
    if (t.matches && t.matches('.f-param') && !t.matches('.input-search')) applyFilters();
    else if (t.matches && t.matches('.input-search.f-param')) applyFilters();
  });
  function applyFilters() {
    var p = {};
    $$('#app-container .f-param').forEach(function (el) { if (el.value) p[el.getAttribute('data-param')] = el.value; });
    ['view', 'periode'].forEach(function (k) { if (AppState.params && AppState.params[k]) p[k] = AppState.params[k]; });
    navigateTo(AppState.page, p, { keep: true });
  }

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target, fid = f.getAttribute('id');
    if (fid === 'form-login') return doLoginSubmit(ev);
    if (fid === 'form-minta') return submitMinta(ev);
    if (fid === 'form-lacak') return submitLacak(ev);
    if (fid === 'form-buka-kunci' || fid === 'form-minta-kunci') return submitKunci(f);
    if (fid === 'form-tim-kelompok') return submitTimKelompok(f);
    if (fid === 'form-is') return isSimpanInd(f, false);
    if (fid === 'form-isian') return submitIsian(f);
    if (fid === 'form-ssg') return submitSsg(f);
    if (fid === 'form-lbr') return submitLembar(f);
    if (fid === 'form-ganti-ind') return submitGantiInd(f);
    if (fid === 'form-bidang') return submitBidang(f);
    if (fid === 'form-hapus-ind') return submitHapusInd(f);
    if (fid === 'form-hapus-bidang') return submitHapusBidang(f);
    if (fid === 'form-ssg-cat') return submitSsgCat(f);
    if (fid === 'form-ssg-ind') return submitSsgInd(f);
    if (fid === 'form-user-modal') return submitUserForm(f);
    if (fid === 'form-program-modal') return submitProgramForm(f);
    if (fid === 'form-target') return submitTarget(f);
    if (fid === 'form-bukti') return submitBukti(f);
    if (fid === 'form-monev') return submitMonev(f);
    if (fid === 'form-mvk-baris') return submitMvkBaris(f);
    if (fid === 'form-mbukti') return submitMonevBukti(f);
    if (fid === 'form-tarik') return;
    if (fid === 'form-md-ajukan') return submitMdAjukan(f);
    if (f.getAttribute('data-api')) return submitGeneric(f);
  });

  /* ---------- inisialisasi ---------- */
  function init() {
    $('#btn-logout-side').addEventListener('click', logout);
    // Cari menu di bilah samping: sembunyikan item yang tidak cocok (dan judul kelompok yang kosong)
    $('#nav-cari').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase(), label = null, ada = false;
      $$('#nav-side > *').forEach(function (el) {
        if (el.classList.contains('nav-label')) { if (label) label.hidden = !ada; label = el; ada = false; return; }
        var cocok = !q || el.textContent.toLowerCase().indexOf(q) >= 0; el.hidden = !cocok; if (cocok) ada = true;
      });
      if (label) label.hidden = !ada;
    });
    var tl = $('#btn-theme-login');
    if (tl) tl.addEventListener('click', function () { window.DkTheme.next(); toast(window.DkTheme.label()); });
    $('#btn-back').addEventListener('click', goBack);
    document.addEventListener('click', function (ev) { var l = ev.target.closest && ev.target.closest('[data-land]'); if (l) landShow(l.getAttribute('data-land')); });
    if (window.DkTheme) window.DkTheme.refresh();
    applyBrand(document.documentElement.getAttribute('data-nama'), document.documentElement.getAttribute('data-sub'));
    applyFavicon(document.documentElement.getAttribute('data-logo'));
    applyLogo(document.documentElement.getAttribute('data-logo'));
    $('#btn-menu').addEventListener('click', openDrawer);
    $('#btn-user').addEventListener('click', function () { profilBuka(); });
    $('#sel-bulan').addEventListener('change', function () { navigateTo(AppState.page, AppState.params).then(function () { prefetchTabs(); prefetchMenu(); }); });
    $('#sel-tahun').addEventListener('change', function () { navigateTo(AppState.page, AppState.params).then(function () { prefetchTabs(); prefetchMenu(); }); });
    $('#skip-link').addEventListener('click', function (e) { e.preventDefault(); $('#main').focus(); });
    ['pointerdown', 'keydown', 'input'].forEach(function (jn) { document.addEventListener(jn, function (ev) { var c = $('#app-container'); if (c && ev.target && c.contains(ev.target)) AppState.disentuh = true; }, true); });
    showLogin('');
    if (API_URL) {
      var cm = null;
      try { cm = JSON.parse(localStorage.getItem('dkppkb_merek') || 'null'); if (cm) { applyBrand(cm.nama, cm.sub); applyLogo(cm.logo); applyFavicon(cm.logo); } } catch (e) { }
      var merekUmur = Infinity; try { merekUmur = Date.now() - Number(localStorage.getItem('dkppkb_merek_t') || 0); } catch (e) { }
      if (merekUmur > 21600000 || !cm) call('apiMerek', []).then(function (r) {   // identitas jarang berubah: cukup tiap 6 jam
        if (!r || !r.success) return;
        applyBrand(r.data.nama, r.data.sub); applyLogo(r.data.logo); applyFavicon(r.data.logo);
        try { localStorage.setItem('dkppkb_merek', JSON.stringify(r.data)); localStorage.setItem('dkppkb_merek_t', String(Date.now())); } catch (e) { }
      }).catch(function () { });
      var tk = null; try { tk = sessionStorage.getItem(SESI_KEY); } catch (e) { }
      if (tk) pulihSesi(tk);
    }
  }
  /** Pulihkan sesi setelah refresh: tampilkan pemuat (bukan halaman login), ulangi bila koneksi lambat, dan hanya keluar bila server menyatakan sesi habis. */
  function pulihSesi(tk, coba) {
    coba = coba || 0;
    AppState.sessionToken = tk;
    if (!coba) {
      show($('#view-login'), false); busy(true);
      var u = null; try { u = sessionStorage.getItem(SESI_KEY + '_u'); } catch (e) { }
      if (u) {
        salinanMuat(u).then(function (s) {
          if (s && s.boot) return startDariSalinan(s.boot, s.tv).then(function () { busy(false); });
          pulihSesi(tk, 1);
        }).catch(function () { pulihSesi(tk, 1); });
        return;
      }
    }
    startApp().then(function () { busy(false); }).catch(function (e) {
      if (e && e.handled) { busy(false); return; }        // sesi benar-benar habis: forceLogout sudah menampilkan login
      if (coba < 3) { setTimeout(function () { pulihSesi(tk, coba + 1); }, 1500 * (coba + 1)); return; }
      busy(false);
      AppState.sessionToken = null;                        // sesi tetap tersimpan: refresh berikutnya mencoba lagi
      showLogin('Koneksi ke server lambat atau terputus. Muat ulang halaman, sesi Anda masih tersimpan.');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.AppState = AppState; window.navigateTo = navigateTo;
})();
